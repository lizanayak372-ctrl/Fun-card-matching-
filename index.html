
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match 💜</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #54366f;
  background: linear-gradient(135deg, #fff4fc, #eadcff, #f8e6f6);
}

.container { max-width: 600px; margin: auto; }
h1 { font-size: 34px; margin: 8px 0; }
.subtitle { color: #80649b; margin-bottom: 20px; }

.panel {
  background: #ffffffdf;
  padding: 15px;
  border-radius: 20px;
  box-shadow: 0 5px 18px #bba2d955;
  margin-bottom: 15px;
}

.controls {
  display: flex;
  gap: 9px;
  justify-content: center;
  flex-wrap: wrap;
  align-items: center;
}

select, button {
  border: none;
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 14px;
  font-weight: bold;
}

select {
  background: #f0e4ff;
  color: #54366f;
}

button {
  background: #a77bd4;
  color: white;
  cursor: pointer;
  transition: 0.15s;
}

button:hover { background: #8c5bbd; }
button:active { transform: scale(0.96); }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.stat {
  background: #f4eaff;
  border-radius: 13px;
  padding: 11px 4px;
}

.stat strong {
  display: block;
  font-size: 21px;
  margin-top: 5px;
}

#message {
  min-height: 25px;
  font-weight: bold;
  margin: 14px 0;
}

.game-board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin: 15px auto;
}

.card {
  width: 100%;
  aspect-ratio: 1;
  padding: 0;
  border-radius: 15px;
  background: #b18add;
  font-size: clamp(25px, 7vw, 40px);
  box-shadow: 0 4px 8px #9272b333;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}

.card .symbol { visibility: hidden; }

.card.flipped, .card.matched {
  background: white;
  color: #54366f;
  outline: 2px solid #d8b9f5;
}

.card.flipped .symbol,
.card.matched .symbol { visibility: visible; }

.card.matched {
  background: #e2f8e8;
  outline-color: #9ed9b0;
  cursor: default;
}

.card:disabled { opacity: 1; }

.footer {
  font-size: 13px;
  color: #80649b;
  margin-top: 18px;
}

@media (max-width: 380px) {
  .game-board { gap: 6px; }
  .card { border-radius: 10px; }
}
</style>
</head>

<body>
<div class="container">
  <h1>Memory Match 💜</h1>
  <p class="subtitle">Flip the cards and find matching pairs! ✨</p>

  <div class="panel">
    <div class="controls">
      <label for="difficulty">Difficulty:</label>

      <select id="difficulty">
        <option value="8">Easy — 8 pairs</option>
        <option value="10">Medium — 10 pairs</option>
        <option value="12">Hard — 12 pairs</option>
      </select>

      <button id="newGame">New Game 🎮</button>
      <button id="restart">Restart ↻</button>
      <button id="musicButton">🎵 Music: OFF</button>
    </div>

    <div class="stats">
      <div class="stat">Time<strong id="timer">00:00</strong></div>
      <div class="stat">Moves<strong id="moves">0</strong></div>
      <div class="stat">Pairs<strong id="pairs">0/8</strong></div>
    </div>
  </div>

  <div id="message">Ready? Let's play! 🌸</div>
  <div id="gameBoard" class="game-board"></div>
  <p class="footer">Made with 💗 and a little bit of magic</p>
</div>

<script>
const pictures = [
  "🌸","🍧","🍓","🌈","🌼","🍒","🍪","🍩",
  "💐","🍉","💕","💎","🌷","🍄","🍎","🥑",
  "🍭","🍦","🌻","🍫","🍀","🪻","🍑","🥝",
  "🩷","🍋","🌺","🎀","🍇","🫐","🍩","🍅",
  "🧁","💜","🍊","🍍"
];

const board = document.getElementById("gameBoard");
const difficulty = document.getElementById("difficulty");
const timerDisplay = document.getElementById("timer");
const movesDisplay = document.getElementById("moves");
const pairsDisplay = document.getElementById("pairs");
const message = document.getElementById("message");
const musicButton = document.getElementById("musicButton");

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let moves = 0;
let matchedPairs = 0;
let totalPairs = 8;
let seconds = 0;
let timerInterval = null;
let timerStarted = false;
let lastPictureSet = "";

let audioContext = null;
let musicOn = false;
let musicTimer = null;
let musicStep = 0;

// Audio starts after the player interacts with the page.
function initAudio() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return false;

  if (!audioContext) audioContext = new AudioCtx();

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return true;
}

function tone(freq, duration, type = "sine", volume = 0.07, delay = 0) {
  if (!initAudio()) return;

  const start = audioContext.currentTime + delay;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(freq, start);

  gain.gain.setValueAtTime(0.001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(start);
  oscillator.stop(start + duration + 0.03);
}

function playFlip() {
  tone(520, 0.07, "sine", 0.035);
}

function playMatch() {
  tone(660, 0.13, "sine", 0.06);
  tone(880, 0.18, "sine", 0.06, 0.10);
  tone(1100, 0.22, "sine", 0.045, 0.20);
}

function playWrong() {
  tone(280, 0.13, "triangle", 0.045);
  tone(220, 0.18, "triangle", 0.035, 0.12);
}

function playWin() {
  [523, 659, 784, 1047].forEach((freq, i) => {
    tone(freq, 0.28, "sine", 0.06, i * 0.17);
  });
}


function startMusic() {
  stopMusic();
  if (!initAudio()) return;

  const melody = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880, 698.46,
    523.25, 659.25, 783.99, 1046.5,
    880, 783.99, 659.25, 523.25
  ];

  let index = 0;

  function playNote() {
    if (!musicOn) return;

    const freq = melody[index % melody.length];
    tone(freq, 0.28, "sine", 0.045);
    tone(freq / 2, 0.30, "triangle", 0.012, 0.02);

    index++;
  }

  playNote();
  musicTimer = setInterval(playNote, 320);
  }
  

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
}

musicButton.addEventListener("click", () => {
  if (!initAudio()) {
    message.textContent = "Audio isn't supported by this browser.";
    return;
  }

  musicOn = !musicOn;

  if (musicOn) {
    musicButton.textContent = "🎵 Music: ON";
    startMusic();
  } else {
    musicButton.textContent = "🎵 Music: OFF";
    stopMusic();
  }
});

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function getRandomPictures(count) {
  let chosen = shuffle(pictures).slice(0, count);
  let signature = [...chosen].sort().join("|");

  if (signature === lastPictureSet) {
    chosen[0] = pictures.find(pic => !chosen.includes(pic));
    signature = [...chosen].sort().join("|");
  }

  lastPictureSet = signature;
  return chosen;
}

function startTimer() {
  if (timerStarted) return;
  timerStarted = true;

  timerInterval = setInterval(() => {
    seconds++;
    const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
    const secs = String(seconds % 60).padStart(2, "0");
    timerDisplay.textContent = `${mins}:${secs}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function resetStats() {
  stopTimer();
  firstCard = null;
  secondCard = null;
  lockBoard = false;
  moves = 0;
  matchedPairs = 0;
  seconds = 0;
  timerStarted = false;

  timerDisplay.textContent = "00:00";
  movesDisplay.textContent = "0";
  pairsDisplay.textContent = `0/${totalPairs}`;
}

function createGame() {
  totalPairs = Number(difficulty.value);
  resetStats();

  message.textContent = "Find all the matching pairs! 🌷";
  board.innerHTML = "";

  board.style.gridTemplateColumns = totalPairs === 10
    ? "repeat(5, minmax(0, 1fr))"
    : "repeat(4, minmax(0, 1fr))";

  const chosen = getRandomPictures(totalPairs);
  const deck = shuffle([...chosen, ...chosen]);

  deck.forEach((picture, index) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.setAttribute("aria-label", `Hidden card ${index + 1}`);
    card.dataset.picture = picture;

    const symbol = document.createElement("span");
    symbol.className = "symbol";
    symbol.textContent = picture;

    card.appendChild(symbol);
    card.addEventListener("click", () => flipCard(card));
    board.appendChild(card);
  });
}

function flipCard(card) {
  if (
    lockBoard ||
    card.classList.contains("flipped") ||
    card.classList.contains("matched")
  ) return;

  initAudio();
  playFlip();
  startTimer();

  card.classList.add("flipped");
  card.setAttribute("aria-label", card.dataset.picture);

  if (!firstCard) {
    firstCard = card;
    return;
  }

  secondCard = card;
  moves++;
  movesDisplay.textContent = moves;
  lockBoard = true;

  if (firstCard.dataset.picture === secondCard.dataset.picture) {
    firstCard.classList.remove("flipped");
    secondCard.classList.remove("flipped");

    firstCard.classList.add("matched");
    secondCard.classList.add("matched");

    firstCard.disabled = true;
    secondCard.disabled = true;

    matchedPairs++;
    pairsDisplay.textContent = `${matchedPairs}/${totalPairs}`;
    playMatch();

    firstCard = null;
    secondCard = null;
    lockBoard = false;

    if (matchedPairs === totalPairs) {
      stopTimer();
      message.textContent =
        `🏆 You won! ${moves} moves in ${timerDisplay.textContent}!`;
      playWin();
    } else {
      message.textContent = "It's a match! ✨";
    }
  } else {
    message.textContent = "Not a match! Try again 💗";
    playWrong();

    const cardOne = firstCard;
    const cardTwo = secondCard;

    setTimeout(() => {
      cardOne.classList.remove("flipped");
      cardTwo.classList.remove("flipped");

      cardOne.setAttribute("aria-label", "Hidden card");
      cardTwo.setAttribute("aria-label", "Hidden card");

      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }, 850);
  }
}

document.getElementById("newGame").addEventListener("click", createGame);
document.getElementById("restart").addEventListener("click", createGame);
difficulty.addEventListener("change", createGame);

createGame();
</script>
</body>
</html>
